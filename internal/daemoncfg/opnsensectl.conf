# /usr/local/etc/opnsensectl.conf - runtime settings for the mwan-opnsense daemon.
#
# opnsensectl install writes this file only when it is absent, so edits here
# survive a reinstall. The daemon reads it at startup, refuses to start when a
# field is missing, and picks up an edit on its next restart.
[daemon]
# virtio-serial-pci device path. /dev/ttyV0.1 corresponds to the first
# virtio-serial port attached to the VM via Proxmox -args.
serial_path = "/dev/ttyV0.1"
baud = 115200
config_xml_path = "/conf/config.xml"
backup_dir = "/conf/backup"
# Where the rc.d wrapper sends daemon output. The wrapper takes the path from
# mwan_opnsense_logfile in /etc/rc.conf.d/mwan_opnsense, so change both together.
logfile = "/var/log/mwan-opnsense.log"
state_dir = "/var/lib/mwan/transfers"
